<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Categoria - Sistema de Extintores</title>
    <link rel="stylesheet" href="styles/novaCategoria.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Sistema de Extintores</h2>
        </div>
        
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="index.html" class="nav-link">
                    <i class="ph ph-squares-four"></i> Início
                </a>
            </li>
            <li class="nav-item">
                <a href="extintores.html" class="nav-link">
                    <i class="ph ph-fire"></i> Extintores
                </a>
            </li>
            <li class="nav-item">
                <a href="movimentacoes.html" class="nav-link">
                    <i class="ph ph-arrows-left-right"></i> Movimentações
                </a>
            </li>
            <li class="nav-item">
                <a href="categorias.html" class="nav-link active">
                    <i class="ph ph-tree-structure"></i> Categorias
                </a>
            </li>
            <li class="nav-item">
                <a href="localizacoes.html" class="nav-link">
                    <i class="ph ph-map-pin"></i> Localizações
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <a href="login.html" class="nav-link">
                <i class="ph ph-sign-out"></i> Sair
            </a>
        </div>
    </aside>

    <main class="content">
        <div class="header-content">
            <div class="header-left">
                <a href="categorias.html" class="back-button"><i class="ph ph-arrow-left"></i>Voltar</a>
                <h1>Nova Categoria</h1>
                <p class="subtitle">Preencha os dados da nova categoria</p>
            </div>
        </div>

        <div class="form-panel">
            <form id="form-nova-categoria">
                <div class="form-group">
                    <label for="descricao">Descrição <span class="required">*</span></label>
                    <input type="text" id="descricao" name="descricao" placeholder="Ex: Classe A" required>
                </div>

                <div class="form-group">
                    <label for="unidade">Unidade <span class="required">*</span></label>
                    <input type="text" id="unidade" name="unidade" placeholder="Ex: kg, L" required>
                </div>

                <div class="form-group">
                    <label for="periodo-inspecao">Período de Inspeção (meses) <span class="required">*</span></label>
                    <input type="number" id="periodo-inspecao" name="periodo-inspecao" placeholder="Ex: 6" required>
                </div>

                <div class="form-group">
                    <label for="periodo-validade">Período de Validade (meses) <span class="required">*</span></label>
                    <input type="number" id="periodo-validade" name="periodo-validade" placeholder="Ex: 12" required>
                </div>

                <div class="action-buttons">
                    <button type="button" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                </div>
            </form>
        </div>
    </main>

    <script src="./scripts/api.js"></script>
    <script src="./scripts/novaCategoria.js"></script>
    <script src="./scripts/logout.js"></script>
</body>
</html>
