<main class="main-content">
  <header class="header">
    <h1>Dashboard</h1>
    <p>Bem-vindo ao sistema de gerenciamento de extintores</p>
  </header>
  <section class="cards-grid">
    <a routerLink="/extintores" class="card">
      <div class="card-icon icon-red"><i class="ph ph-fire"></i></div>
      <h3>Extintores</h3><p>Gerencie todos os extintores cadastrados</p>
    </a>
    <a routerLink="/movimentacoes" class="card">
      <div class="card-icon icon-blue"><i class="ph ph-arrows-left-right"></i></div>
      <h3>Movimentações</h3><p>Controle as movimentações de extintores</p>
    </a>
    <a routerLink="/categorias" class="card">
      <div class="card-icon icon-purple"><i class="ph ph-tree-structure"></i></div>
      <h3>Categorias</h3><p>Organize por categorias</p>
    </a>
    <a routerLink="/localizacoes" class="card">
      <div class="card-icon icon-green"><i class="ph ph-map-pin"></i></div>
      <h3>Localizações</h3><p>Gerencie as localizações</p>
    </a>
  </section>
</main>
