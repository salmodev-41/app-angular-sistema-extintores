<main class="main-content">
  <div class="top-bar"><a routerLink="/movimentacoes" class="back-link"><i class="ph ph-arrow-left"></i> Voltar</a></div>
  <div class="content-header"><h1>{{ editId ? 'Editar Movimentação' : 'Nova Movimentação' }}</h1><p>{{ editId ? 'Atualize os dados da movimentação' : 'Preencha os dados da nova movimentação' }}</p></div>
  <div class="form-container">
    <form (ngSubmit)="save()">
      <div class="form-grid">
        <div class="form-group"><label for="empresa">Empresa *</label><input id="empresa" name="empresaCodigo" type="text" placeholder="Ex: Matriz" required [(ngModel)]="movimentacao.empresaCodigo"></div>
        <div class="form-group"><label for="empresa-destino">Empresa Destino *</label><input id="empresa-destino" name="empresaDestinoCodigo" type="text" placeholder="Ex: Filial" required [(ngModel)]="movimentacao.empresaDestinoCodigo"></div>
        <div class="form-group"><label for="tipo-movimentacao">Tipo de Movimentação *</label><select id="tipo-movimentacao" name="tipo" required [(ngModel)]="movimentacao.tipo"><option value="" disabled>Selecione o tipo</option><option value="F">Recarga/Inspeção</option><option value="S">Envio Serviço(Empresa)</option><option value="T">Transferência</option></select></div>
        <div class="form-group"><label for="data-movimentacao">Data da Movimentação *</label><input id="data-movimentacao" name="data" type="date" required [(ngModel)]="movimentacao.data"></div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn-cancelar" (click)="cancel()">Cancelar</button>
        <button type="submit" class="btn-cadastrar" [disabled]="saving">{{ editId ? 'Salvar Alterações' : 'Cadastrar' }}</button>
      </div>
    </form>
  </div>
</main>
