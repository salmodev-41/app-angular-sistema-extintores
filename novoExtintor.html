<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Extintores - Novo Extintor</title>
    <link rel="stylesheet" href="styles/novoExtintor.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Sistema de Extintores</h2>
        </div>
        
        <ul class="nav-menu">
            <li class="nav-item">
                <a href="index.html" class="nav-link">
                    <i class="ph ph-squares-four"></i> Início
                </a>
            </li>
            <li class="nav-item">
                <a href="extintores.html" class="nav-link active">
                    <i class="ph ph-fire"></i> Extintores
                </a>
            </li>
            <li class="nav-item">
                <a href="movimentacoes.html" class="nav-link">
                    <i class="ph ph-arrows-left-right"></i> Movimentações
                </a>
            </li>
            <li class="nav-item">
                <a href="categorias.html" class="nav-link">
                    <i class="ph ph-tree-structure"></i> Categorias
                </a>
            </li>
            <li class="nav-item">
                <a href="localizacoes.html" class="nav-link">
                    <i class="ph ph-map-pin"></i> Localizações
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <a href="login.html" class="nav-link">
                <i class="ph ph-sign-out"></i> Sair
            </a>
        </div>
    </aside>

    <main class="main-content">
        
        <div class="back-link">
            <a href="extintores.html"><i class="ph ph-arrow-left"></i> Voltar</a>
        </div>

        <header class="page-header">
            <div class="page-title">
                <h1>Novo Extintor</h1>
                <p>Preencha os dados do novo extintor</p>
            </div>
        </header>

        <section class="content-card">
            <form id="form-novo-extintor">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Numero *</label>
                        <input type="text" id="codigo" placeholder="Ex: EXT001" required>
                    </div>
                    
                    <div class="form-group">
                        <label>Tipo *</label>
                        <select id="tipo" required>
                            <option value="" disabled selected>Selecione o tipo</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Capacidade (kg) *</label>
                        <input type="number" step="0.1" id="capacidade" placeholder="Ex: 6" required>
                    </div>

                    <div class="form-group">
                        <label>Localização *</label>
                        <select id="localizacao" required>
                            <option value="" disabled selected>Selecione a localização</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Data de Validade *</label>
                        <input type="date" id="dataValidade" required>
                    </div>

                    <div class="form-group">
                        <label>Data Próx. Inspeção *</label>
                        <input type="date" id="dataProxInspecao" required>
                    </div>

                    <div class="form-group">
                        <label>Status *</label>
                        <select id="status" name="status" required>
                            <option value="A" selected>Ativo</option>
                            <option value="I">Inativo</option>
                            <option value="R">Recarga</option>
                            <option value="S">Substituido</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Centro de Custo *</label>
                        <input type="text" id="centroCusto" placeholder="Ex: CC-102" required>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" onclick="window.location.href='extintores.html'">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                </div>
            </form>
        </section>
    </main>
<script src="./scripts/api.js"></script>   
<script src="./scripts/novoExtintor.js"></script>
<script src="./scripts/logout.js"></script>
</body>
</html>
