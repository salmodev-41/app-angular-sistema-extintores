<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Movimentação - Sistema de Extintores</title>
    <link rel="stylesheet" href="styles/novaMovimentacao.css">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Sistema de Extintores</h2>
            </div>
            
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="index.html" class="nav-link">
                        <i class="ph ph-squares-four"></i> Início
                    </a>
                </li>
                <li class="nav-item">
                    <a href="extintores.html" class="nav-link">
                        <i class="ph ph-fire"></i> Extintores
                    </a>
                </li>
                <li class="nav-item">
                    <a href="movimentacoes.html" class="nav-link active">
                        <i class="ph ph-arrows-left-right"></i> Movimentações
                    </a>
                </li>
                <li class="nav-item">
                    <a href="categorias.html" class="nav-link">
                        <i class="ph ph-tree-structure"></i> Categorias
                    </a>
                </li>
                <li class="nav-item">
                    <a href="localizacoes.html" class="nav-link">
                        <i class="ph ph-map-pin"></i> Localizações
                    </a>
                </li>
            </ul>

            <div class="sidebar-footer">
                <a href="login.html" class="nav-link">
                    <i class="ph ph-sign-out"></i> Sair
                </a>
            </div>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <a href="movimentacoes.html" class="back-link"><i class="ph ph-arrow-left"></i> Voltar</a>
            </div>

            <div class="content-header">
                <h1>Nova Movimentação</h1>
                <p>Preencha os dados da nova movimentação</p>
            </div>

            <div class="form-container">
                <form id="form-movimentacao">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="empresa">Empresa *</label>
                            <input type="text" id="empresa" placeholder="Ex: Matriz" required>
                        </div>

                        <div class="form-group">
                            <label for="empresa-destino">Empresa Destino *</label>
                            <input type="text" id="empresa-destino" placeholder="Ex: Filial" required>
                        </div>

                        <div class="form-group">
                            <label for="tipo">Tipo de Movimentação *</label>
                            <select id="tipo" required>
                                <option value="" disabled selected>Selecione o tipo</option>
                                <option value="F">Recarga/Inspeção</option>
                                <option value="S">Envio Serviço(Empresa)</option>
                                <option value="T">Transferência</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="data">Data da Movimentação *</label>
                            <input type="date" id="data" required>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="button" class="btn-cancelar">Cancelar</button>
                        <button type="submit" class="btn-cadastrar">Cadastrar</button>
                    </div>
                </form>
            </div>
        </main>
    </div>
    <script src="./scripts/api.js"></script>
    <script src="./scripts/novaMovimentacao.js"></script>
    <script src="./scripts/logout.js"></script>
</body>
</html>
